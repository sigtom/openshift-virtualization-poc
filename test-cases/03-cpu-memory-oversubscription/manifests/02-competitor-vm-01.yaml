# Case 03 - NOT TESTED. Competitor VM 01. Start only as many as the approved plan says.
#
# OPTIONAL FALLBACK (Path B). Prefer suitable EXISTING VMs with no changes (case ADMIN-GUIDE,
# "Path A"). Apply this file only when no suitable existing VM is available.
# BEFORE APPLYING replace:
# Disk default: vxflexos, ReadWriteMany, Block. Confirm support before creation.
#   REPLACE_DATASOURCE_NAME       the approved image DataSource that ALREADY contains the guest tools
#   REPLACE_DATASOURCE_NAMESPACE  namespace of that DataSource
# The disk must be at least as large as the source image. Starts Halted; nothing is labelled here.
# The guest helper commands are NOT in this file: cloud-init user data is limited to 2048 bytes.
# They come from the approved image (installed in /usr/local/bin) or are copied from guest-tools/
# by an administrator (ADMIN-GUIDE). Running is not the same as ready: check the guest first.
# Console user: the serial console auto-logs in as unprivileged cloud-user (no sudo, no password,
# root and SSH password login disabled). Anyone allowed to open this VM's console gets that shell.
# POC convenience only, not a production guest policy.
#
# Placement: REQUIRED node label perf-lab.example.com/cpumem-host=true. The administrator labels exactly ONE
# worker (ADMIN-GUIDE section 5) so the measured VM and every competitor share that host.
# No evictionStrategy and no explicit memory request/limit are set on purpose: the memory
# request is derived from the guest memory, so any cluster density setting applies unchanged.
# More competitors: scripts/render-competitor.sh (ADMIN-GUIDE section 7).
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: cpumem-load-01
  namespace: perf-cpumem-lab
  labels:
    perf-lab.example.com/case: "03"
spec:
  runStrategy: Halted
  dataVolumeTemplates:
    - apiVersion: cdi.kubevirt.io/v1beta1
      kind: DataVolume
      metadata:
        name: cpumem-load-01-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: REPLACE_DATASOURCE_NAME
          namespace: REPLACE_DATASOURCE_NAMESPACE
        storage:
          storageClassName: vxflexos
          accessModes:
            - ReadWriteMany
          volumeMode: Block
          resources:
            requests:
              storage: 30Gi
  template:
    metadata:
      annotations:
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      labels:
        perf-lab.example.com/case: "03"
        perf-lab.example.com/vm: cpumem-load-01
        kubevirt.io/domain: cpumem-load-01
    spec:
      architecture: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: perf-lab.example.com/cpumem-host
                    operator: In
                    values:
                      - "true"
      terminationGracePeriodSeconds: 60
      domain:
        cpu:
          sockets: 1
          cores: 2
          threads: 1
        memory:
          guest: 4Gi
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
          rng: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: cpumem-load-01-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            # Minimal on purpose (limit 2048 bytes). Explicit users list: no passwordless sudo.
            userData: |
              #cloud-config
              hostname: cpumem-load-01
              ssh_pwauth: false
              disable_root: true
              users:
                - name: cloud-user
                  lock_passwd: true
                  shell: /bin/bash
              write_files:
                - path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf
                  content: |
                    [Service]
                    ExecStart=
                    ExecStart=-/sbin/agetty --autologin cloud-user --noclear --keep-baud 115200,57600,38400,9600 %I $TERM
              runcmd:
                - [systemctl, enable, --now, qemu-guest-agent]
                - [systemctl, daemon-reload]
                - [systemctl, restart, serial-getty@ttyS0.service]
