# Case 03 - NOT TESTED. Administrator preparation only; read MEMORY-DENSITY.md first.
# Based on the OpenShift Virtualization 4.21/4.22 documented WASP procedure.
# Keeps its /var/tmp/swapfile path, kubelet drop-in and system-slice protection.
# Differences: case-owned MachineConfig/unit names, approved pool role and agreed swap size.
#
# Replace REPLACE_POOL_ROLE and REPLACE_SWAP_SIZE_MB (MiB) from the results sheet.
# The pool must contain only approved worker-only nodes. Never target master.
# Applying this drains and reboots every node in that pool.
#
# Before applying: verify /var/tmp is on the node's approved fast root filesystem,
# with enough free space for swap plus headroom. SD/removable boot media is not suitable.
# A separate mount or alternate path needs its own reviewed procedure; this template does
# not provision it. No existing disk is partitioned or formatted by this template.
#
# Stop if /var/tmp/swapfile, 90-swap.conf or any perf-swap-* unit already exists,
# or another MachineConfig owns them. The drop-in's overwrite:true follows the vendor sample;
# collision checks must establish there is no existing owner before applying it.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 90-REPLACE_POOL_ROLE-perf-swap
  labels:
    machineconfiguration.openshift.io/role: REPLACE_POOL_ROLE
    perf-lab.example.com/case: "03"
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
        - path: /etc/openshift/kubelet.conf.d/90-swap.conf
          mode: 420
          overwrite: true
          contents:
            # Decodes to:  apiVersion: kubelet.config.k8s.io/v1beta1
            #              kind: KubeletConfiguration
            #              failSwapOn: false
            source: data:text/plain;charset=utf-8;base64,YXBpVmVyc2lvbjoga3ViZWxldC5jb25maWcuazhzLmlvL3YxYmV0YTEKa2luZDogS3ViZWxldENvbmZpZ3VyYXRpb24KZmFpbFN3YXBPbjogZmFsc2UK
    systemd:
      units:
        - name: perf-swap-provision.service
          enabled: true
          contents: |
            [Unit]
            Description=Provision and enable the swap file on first use
            ConditionFirstBoot=no
            ConditionPathExists=!/var/tmp/swapfile

            [Service]
            Type=oneshot
            Environment=SWAP_SIZE_MB=REPLACE_SWAP_SIZE_MB
            ExecStart=/bin/sh -c "sudo fallocate -l ${SWAP_SIZE_MB}M /var/tmp/swapfile && sudo chmod 600 /var/tmp/swapfile && sudo mkswap /var/tmp/swapfile && sudo swapon /var/tmp/swapfile && free -h"

            [Install]
            RequiredBy=kubelet-dependencies.target
        - name: perf-swap-enable.service
          enabled: true
          contents: |
            [Unit]
            Description=Enable the existing swap file on later boots
            ConditionFirstBoot=no
            ConditionPathExists=/var/tmp/swapfile

            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c "sudo swapon /var/tmp/swapfile"

            [Install]
            RequiredBy=kubelet-dependencies.target
        - name: perf-swap-system-slice.service
          enabled: true
          contents: |
            [Unit]
            Description=Keep system services out of swap
            ConditionFirstBoot=no

            [Service]
            Type=oneshot
            ExecStart=/bin/sh -c 'sudo systemctl set-property --runtime system.slice MemorySwapMax=0 IODeviceLatencyTargetSec="/ 50ms"'

            [Install]
            RequiredBy=kubelet-dependencies.target
