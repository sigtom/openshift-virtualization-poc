# Case 02 - review and fill local values before use. Shipped PAUSED on purpose.
#
# SOURCE-ONLY SCOPE. The selector must match exactly ONE node: the approved
# non-control-plane SOURCE worker that carries the dedicated label
#   host-recovery-lab.example.com/source=case02
# TARGET is a separate healthy virtualization host OUTSIDE this selector. Never
# put the label on TARGET and never add TARGET to the FAR template.
#
# maxUnhealthy: 1 is mutually exclusive with minHealthy; do not add minHealthy.
# It is only safe here because exactly one node is selected. Verify that
# selection (RUNBOOK readiness check) before removing the pause.
# Check the installed schema first: oc explain nodehealthcheck.spec
#
# pauseRequests stops NEW remediations only; in-flight ones keep running. While
# paused, NHC reports observed/healthy 0/0 and skips cleanup of remediation
# objects for healthy nodes, so do not read counts while paused.
# Remove the pause ONLY at the RUNBOOK activation step. Once active, expect
# observed=1 healthy=1 before the fault.
#
# unhealthyConditions: Ready False or Unknown for 300s. Not a recovery-time promise.
apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: case02-host-recovery
  labels:
    host-recovery-lab.example.com/case: "02"
spec:
  pauseRequests:
    - case02-setup-hold
  maxUnhealthy: 1
  selector:
    matchExpressions:
      - key: node-role.kubernetes.io/worker
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
      - key: node-role.kubernetes.io/master
        operator: DoesNotExist
      - key: host-recovery-lab.example.com/source
        operator: In
        values:
          - "case02"
  unhealthyConditions:
    - type: Ready
      status: "False"
      duration: 300s
    - type: Ready
      status: Unknown
      duration: 300s
  remediationTemplate:
    apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
    kind: FenceAgentsRemediationTemplate
    name: case02-far-redfish-reboot
    namespace: openshift-workload-availability
