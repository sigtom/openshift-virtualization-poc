# Case 02 - review and fill local values before use. Use ONLY if Node Health Check is MISSING
# (ADMIN-GUIDE "Operator check"). Apply this single file alone; the Fence Agents
# Remediation subscription is a separate file.
#
# No Namespace and no OperatorGroup here: reuse the existing ones in
# openshift-workload-availability. If it has no OperatorGroup, follow the Red Hat
# install procedure instead of adding a second one. Check the package and channel
# with: oc get packagemanifest node-healthcheck-operator -n openshift-marketplace
# Manual approval: you approve the exact InstallPlan (ADMIN-GUIDE).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: node-health-check
  namespace: openshift-workload-availability
spec:
  channel: stable
  installPlanApproval: Manual
  name: node-healthcheck-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
