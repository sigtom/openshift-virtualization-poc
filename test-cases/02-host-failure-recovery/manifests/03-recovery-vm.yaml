# Case 02 - review and fill local values before use. DISPOSABLE test VM.
# Use this ONLY if no existing approved VM already fits and runs on SOURCE.
# An existing suitable VM is reused unchanged and this file is skipped.
#
# BEFORE APPLYING replace:
#   REPLACE_SSH_PUBLIC_KEY : one SSH public key line for cloud-user (no password exists)
# Confirm the boot source (DataSource rhel9 in openshift-virtualization-os-images)
# exists: oc get datasource -n openshift-virtualization-os-images
# Increase the requested size if the selected source image needs more than 40Gi.
#
# Client VM storage stays vxflexos, Block, ReadWriteMany (RWX): TARGET must be
# able to attach the same disk after SOURCE is fenced. Confirm the installed
# storage driver and StorageProfile first.
#
# Starts Halted. Start it only at the RUNBOOK start step.
# Placement: PREFERRED = the SOURCE label; nothing is hard-pinned, so the VM can
# restart on another node. The RUNBOOK confirms it really runs on SOURCE; if it
# does not, stop. No evictionStrategy: this case cordons, it does not drain, and
# a node-failure restart is not a live migration.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: recovery-vm
  namespace: host-recovery-lab
  labels:
    host-recovery-lab.example.com/case: "02"
spec:
  runStrategy: Halted
  dataVolumeTemplates:
    - metadata:
        name: recovery-vm-rootdisk
      spec:
        sourceRef:
          kind: DataSource
          name: rhel9
          namespace: openshift-virtualization-os-images
        storage:
          storageClassName: vxflexos
          volumeMode: Block
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 40Gi
  template:
    metadata:
      annotations:
        vm.kubevirt.io/os: rhel9
        vm.kubevirt.io/workload: server
      labels:
        host-recovery-lab.example.com/case: "02"
        kubevirt.io/domain: recovery-vm
    spec:
      architecture: amd64
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: host-recovery-lab.example.com/source
                    operator: In
                    values:
                      - "case02"
      terminationGracePeriodSeconds: 60
      domain:
        cpu:
          cores: 1
          sockets: 1
          threads: 1
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              model: virtio
          rng: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: recovery-vm-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: recovery-vm
              ssh_pwauth: false
              users:
                - name: cloud-user
                  lock_passwd: true
                  shell: /bin/bash
                  ssh_authorized_keys:
                    - REPLACE_SSH_PUBLIC_KEY
