# Case 02 - review and fill local values before use.
# The operator schema INSTALLED on the cluster governs; check with
#   oc explain fenceagentsremediationtemplate.spec.template.spec
#
# SOURCE ONLY. This template maps the SOURCE node only. Never add TARGET or any
# TARGET credential here.
#
# BEFORE APPLYING replace every REPLACE_* value:
#   REPLACE_SOURCE_NODE      : exact SOURCE Node name (oc get node)
#   REPLACE_SOURCE_BMC_HOST  : that node's own BMC address
#   REPLACE_SOURCE_SYSTEM_ID : the Redfish Systems member id of that same server,
#                              read from read-only inventory (ADMIN-GUIDE).
#                              Dell iDRAC is commonly System.Embedded.1; do not assume.
#
# Credentials are NOT here. The Secret case02-bmc-source is created privately
# (ADMIN-GUIDE) with keys --username and --password. A parameter must not be
# defined in both a Secret and this CR, so no username/password below.
#
# TLS is verified by default. Do not add --ssl-insecure. If the BMC certificate
# is not trusted by the FAR image, STOP; any exception is a separate, approved,
# host-specific decision (ADMIN-GUIDE "BMC certificate trust").
#
# OutOfServiceTaint removes pods and volume attachments on the failed node.
# Timeouts are bounded test limits, not a recovery-time commitment.
apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: case02-far-redfish-reboot
  namespace: openshift-workload-availability
  labels:
    host-recovery-lab.example.com/case: "02"
spec:
  template:
    spec:
      agent: fence_redfish
      remediationStrategy: OutOfServiceTaint
      retrycount: 3
      retryinterval: "10s"
      timeout: "60s"
      sharedparameters:
        --action: "reboot"
      nodeparameters:
        --ip:
          REPLACE_SOURCE_NODE: "REPLACE_SOURCE_BMC_HOST"
        --systems-uri:
          REPLACE_SOURCE_NODE: "/redfish/v1/Systems/REPLACE_SOURCE_SYSTEM_ID"
      nodeSecretNames:
        REPLACE_SOURCE_NODE: case02-bmc-source
