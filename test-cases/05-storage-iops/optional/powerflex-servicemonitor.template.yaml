metadata:
  name: poc-powerflex-observability
  namespace: REPLACE_CSM_NAMESPACE
  labels:
    perf-lab.example.com/case: "05"
spec:
  selector:
    matchLabels:
      REPLACE_SERVICE_LABEL_KEY: REPLACE_SERVICE_LABEL_VALUE
  endpoints:
    - port: exporter-https
      scheme: https
      path: /metrics
      interval: 30s
      tlsConfig:
        serverName: REPLACE_SERVER_NAME_FROM_CERT_SAN
        ca:
          configMap:
            name: REPLACE_CA_CONFIGMAP
            key: REPLACE_CA_KEY
