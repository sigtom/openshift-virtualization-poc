# SNIPPET, NOT A MANIFEST. Do NOT `oc apply` this file: applying a one-provider OAuth
# resource would REPLACE the whole identityProviders list and remove the existing providers.
# Preferred path: console > Administration > Cluster Settings > Configuration > OAuth >
# Add > HTPasswd. If you must edit YAML, open the existing `cluster` OAuth object and APPEND
# this single list item under spec.identityProviders, leaving every other entry untouched.
- name: REPLACE_IDP_NAME               # unique; becomes the identity prefix, e.g. poc-htpasswd
  mappingMethod: claim                 # a login that collides with another provider's user is refused
  type: HTPasswd
  htpasswd:
    fileData:
      name: REPLACE_SECRET_NAME        # Secret in openshift-config with key htpasswd
