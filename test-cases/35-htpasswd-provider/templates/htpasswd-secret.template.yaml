# TEMPLATE ONLY. Use ONLY when no managed HTPasswd Secret exists and you are creating a
# genuinely new provider. Never commit a filled copy. Prefer the console: Add identity
# provider > HTPasswd uploads the file and creates this Secret for you.
# To change an EXISTING Secret, follow the administrator guide (retrieve the file, htpasswd,
# oc create secret generic --dry-run=client | oc replace); do not apply this template over it.
apiVersion: v1
kind: Secret
metadata:
  name: REPLACE_SECRET_NAME            # for example poc-htpasswd-secret
  namespace: openshift-config
type: Opaque
data:
  htpasswd: REPLACE_BASE64_OF_PRIVATE_HTPASSWD_FILE   # placeholder only; never a real hash
