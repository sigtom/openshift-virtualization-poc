# TEMPLATE. Grants FULL cluster-wide administrative privilege to one user. Use only with
# agreement on the user receiving full control. Create with `oc create -f` (never apply), so an
# existing binding with this name is never changed; save the new binding's UID for cleanup.
# cluster-admin is a ClusterRole, so this is a ClusterRoleBinding (no namespaced equivalent). Console: User Management > RoleBindings >
# Create binding > Cluster-wide role binding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: REPLACE_BINDING_NAME           # for example poc-cluster-admin-REPLACE_USER
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: REPLACE_USER                 # the login name as the User object shows it
