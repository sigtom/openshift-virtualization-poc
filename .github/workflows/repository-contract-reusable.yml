name: repository-contract-reusable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-contract:
    name: Repository contract
    runs-on: arc-repo-template-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate repository-first contract
        run: python3 scripts/check_repository_contract.py

      - name: Run checker regression tests
        run: python3 -m unittest tests/test_check_repository_contract.py
